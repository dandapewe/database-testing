# Database Configuration for Supabase PostgreSQL
# Gantilah dengan credentials Supabase Anda

# URL koneksi database Supabase
db.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres

# Username database
db.username=postgres.iinalzdbpgbqxgyxrqzr

# Password database (gunakan password dari Supabase)
db.password=danda

# JDBC Driver class
db.driver=org.postgresql.Driver

# Connection Pool Settings
db.pool.initialSize=5
db.pool.maxTotal=20
db.pool.maxIdle=10
db.pool.minIdle=5

# Test configuration
db.test.on.startup=true

# Timeout settings
db.connection.timeout=30000
db.socket.timeout=30000

# SSL settings
db.ssl=true
db.sslmode=require